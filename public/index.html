<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>雀荘オンライン</title>
<style>


@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700;900&family=Zen+Antique&family=Share+Tech+Mono&display=swap');
:root{
  --felt:#1a4a2e;--felt-dark:#0d2a1a;--felt-mid:#1f5535;
  --gold:#c9a84c;--gold-lt:#e8c86d;--gold-dim:#8b6914;
  --ivory:#f5f0e8;--red:#c0392b;--blue:#2471a3;--green:#1e8449;
  --tile:#faf6ed;--tile-sh:rgba(0,0,0,.45);
  --bdr:1px solid rgba(201,168,76,.3);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--felt-dark);color:var(--ivory);font-family:'Noto Serif JP',serif;
  background-image:radial-gradient(ellipse at 50% 0%,#265e38 0%,transparent 65%),
  repeating-linear-gradient(45deg,transparent,transparent 18px,rgba(0,0,0,.04) 18px,rgba(0,0,0,.04) 36px);}

/* ── SCREENS ── */
.screen{display:none;height:100vh;overflow:auto}
.screen.active{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1.5rem;gap:1.2rem}

/* ── LOBBY ── */
.logo-kanji{font-family:'Zen Antique',serif;font-size:clamp(3.5rem,10vw,6rem);color:var(--gold);
  text-shadow:0 0 40px rgba(201,168,76,.4),0 4px 8px rgba(0,0,0,.7);letter-spacing:.1em}
.logo-sub{font-size:.8rem;color:var(--gold-lt);letter-spacing:.4em;opacity:.8;margin-top:.3rem}
.deco{width:180px;height:1px;background:linear-gradient(to right,transparent,var(--gold),transparent);margin:.8rem auto}
.card{background:linear-gradient(135deg,rgba(255,255,255,.06),rgba(255,255,255,.02));
  border:var(--bdr);border-radius:4px;padding:1.5rem;width:100%;max-width:400px;
  box-shadow:0 8px 32px rgba(0,0,0,.5),inset 0 1px 0 rgba(201,168,76,.1)}
.card-title{font-family:'Zen Antique',serif;color:var(--gold);font-size:1rem;letter-spacing:.2em;margin-bottom:1.2rem;text-align:center}
.lbl{display:block;font-size:.72rem;letter-spacing:.12em;color:var(--gold-lt);margin-bottom:.4rem;opacity:.8}
input[type=text]{width:100%;background:rgba(0,0,0,.35);border:1px solid rgba(201,168,76,.3);border-radius:2px;
  color:var(--ivory);font-family:'Noto Serif JP',serif;font-size:.95rem;padding:.7rem .9rem;outline:none;margin-bottom:.9rem;transition:border-color .2s}
input:focus{border-color:var(--gold)}
input::placeholder{color:rgba(245,240,232,.3)}
.btn{width:100%;padding:.8rem;border:none;border-radius:2px;cursor:pointer;font-family:'Zen Antique',serif;
  font-size:.95rem;letter-spacing:.2em;transition:all .2s}
.btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold-dim));color:var(--felt-dark);font-weight:700;
  box-shadow:0 4px 12px rgba(201,168,76,.35);margin-bottom:.7rem}
.btn-gold:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(201,168,76,.5)}
.btn-outline{background:transparent;border:1px solid rgba(201,168,76,.4);color:var(--gold-lt)}
.btn-outline:hover{background:rgba(201,168,76,.1);border-color:var(--gold)}
.btn-cpu{background:rgba(30,132,73,.2);border:1px solid rgba(30,132,73,.5);color:#5dde8a;margin-bottom:.7rem}
.btn-cpu:hover{background:rgba(30,132,73,.35);border-color:#5dde8a}
.slot-type-badge{font-size:.58rem;letter-spacing:.06em;padding:.1rem .35rem;border-radius:2px;margin-top:.15rem}
.slot-type-badge.cpu{background:rgba(30,132,73,.25);color:#5dde8a;border:1px solid rgba(30,132,73,.4)}
.slot-type-badge.human{background:rgba(36,113,163,.25);color:#7ec8f5;border:1px solid rgba(36,113,163,.4)}
.slot-type-badge.waiting{background:rgba(201,168,76,.1);color:rgba(245,240,232,.4)}
.divider{display:flex;align-items:center;gap:.8rem;color:rgba(245,240,232,.3);font-size:.75rem;margin:.4rem 0}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:rgba(201,168,76,.2)}
.share-box{background:rgba(0,0,0,.35);border:var(--bdr);border-radius:2px;padding:.7rem .9rem;
  display:flex;align-items:center;gap:.7rem;margin-bottom:1rem}
.share-url{flex:1;font-family:'Share Tech Mono',monospace;font-size:.7rem;color:var(--gold-lt);word-break:break-all;line-height:1.4}
.copy-btn{background:rgba(201,168,76,.15);border:1px solid rgba(201,168,76,.3);border-radius:2px;
  color:var(--gold);cursor:pointer;padding:.35rem .7rem;font-size:.7rem;white-space:nowrap;transition:all .2s;font-family:'Noto Serif JP',serif}
.copy-btn:hover{background:rgba(201,168,76,.28)}
.room-id-big{font-family:'Share Tech Mono',monospace;font-size:2rem;color:var(--gold);letter-spacing:.35em;text-align:center;margin:.5rem 0}

/* ── WAIT ROOM ── */
.player-grid{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;width:100%;max-width:400px}
.p-slot{background:rgba(0,0,0,.3);border:1px solid rgba(201,168,76,.2);border-radius:3px;padding:1rem;
  text-align:center;min-height:80px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.3rem;transition:all .3s}
.p-slot.filled{border-color:rgba(201,168,76,.5);background:rgba(201,168,76,.05)}
.p-slot.me{border-color:var(--gold);box-shadow:0 0 12px rgba(201,168,76,.2)}
.p-avatar{font-size:1.6rem}
.p-name{font-size:.82rem}
.p-wind{font-size:.68rem;color:var(--gold);letter-spacing:.1em}
.p-empty{font-size:.7rem;color:rgba(245,240,232,.3);letter-spacing:.08em}
.dots span{animation:blink 1.4s infinite;opacity:0}
.dots span:nth-child(2){animation-delay:.2s}
.dots span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:0}40%{opacity:1}}

/* ── GAME BOARD ── */
#screen-game{display:none;height:100vh;flex-direction:column;overflow:hidden}
#screen-game.active{display:flex}

.g-header{background:rgba(0,0,0,.5);border-bottom:var(--bdr);padding:.45rem .8rem;
  display:flex;justify-content:space-between;align-items:center;flex-shrink:0;gap:.5rem;flex-wrap:wrap}
.g-round{font-family:'Zen Antique',serif;color:var(--gold);font-size:.85rem;letter-spacing:.15em}
.g-scores{display:flex;gap:.5rem;flex-wrap:wrap}
.score-chip{background:rgba(0,0,0,.4);border:var(--bdr);border-radius:2px;
  padding:.15rem .5rem;font-family:'Share Tech Mono',monospace;font-size:.7rem}
.score-chip b{color:var(--gold)}
.online-dot{width:6px;height:6px;background:#2ecc71;border-radius:50%;animation:pulse 2s infinite;display:inline-block;margin-right:.3rem}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* TABLE */
.table-wrap{flex:1;display:grid;min-height:0;
  grid-template-areas:". top ." "left center right" ". bottom .";
  grid-template-columns:minmax(50px,auto) 1fr minmax(50px,auto);
  grid-template-rows:auto 1fr auto;gap:3px;padding:4px;overflow:hidden}

.opp-zone{display:flex;flex-direction:column;align-items:center;gap:3px;padding:3px}
.opp-zone.top{grid-area:top}
.opp-zone.left{grid-area:left;flex-direction:row;align-items:center;writing-mode:horizontal-tb}
.opp-zone.right{grid-area:right;flex-direction:row-reverse;align-items:center}

.opp-tag{font-size:.65rem;color:var(--gold-lt);letter-spacing:.08em;background:rgba(0,0,0,.5);
  padding:.15rem .5rem;border:var(--bdr);border-radius:2px;white-space:nowrap}
.opp-score-tag{font-family:'Share Tech Mono',monospace;font-size:.6rem;color:rgba(245,240,232,.5)}
.opp-tiles-row{display:flex;gap:2px;flex-wrap:wrap;justify-content:center}
.opp-tiles-col{display:flex;flex-direction:column;gap:2px}

/* TILES */
.tile{display:inline-flex;align-items:center;justify-content:center;
  background:var(--tile);border-radius:2px;border:1px solid #bbb;
  box-shadow:0 2px 4px var(--tile-sh),inset 0 1px 0 rgba(255,255,255,.8);
  cursor:pointer;transition:all .12s;user-select:none;font-weight:700;flex-shrink:0}
.tile.man{color:#c0392b}.tile.pin{color:#2471a3}.tile.sou{color:#1e8449}.tile.honor{color:#2c3e50}
.tile.back{background:linear-gradient(135deg,#2a5c3c,#183d26);border-color:rgba(201,168,76,.35);cursor:default}
.tile.selected{transform:translateY(-8px);box-shadow:0 8px 16px rgba(201,168,76,.6);border-color:var(--gold)}
.tile.suggest{border-color:#e74c3c;box-shadow:0 0 8px rgba(231,76,60,.5)}
.tile.riichi-tile{opacity:.7;cursor:not-allowed}
.tile.last-draw{animation:drawAnim .25s ease}
@keyframes drawAnim{from{transform:translateY(10px);opacity:0}to{transform:translateY(0);opacity:1}}

.th{width:30px;height:42px;font-size:1.1rem} /* hand */
.td{width:20px;height:28px;font-size:.75rem} /* discard */
.tb{width:16px;height:22px}                  /* opp back small */
.tb2{width:22px;height:30px}                 /* opp back medium */
.tm{width:24px;height:34px;font-size:.9rem}  /* meld */

/* CENTER */
.center-zone{grid-area:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:0}
.wind-ring{width:62px;height:62px;border:2px solid rgba(201,168,76,.4);border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-family:'Zen Antique',serif;
  font-size:1.6rem;color:var(--gold);background:rgba(0,0,0,.5);box-shadow:0 0 20px rgba(201,168,76,.12);flex-shrink:0}
.deck-count{font-family:'Share Tech Mono',monospace;font-size:.7rem;color:rgba(245,240,232,.5);text-align:center}
.discard-area{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;
  background:rgba(0,0,0,.25);border:var(--bdr);border-radius:2px;padding:4px;max-width:160px;min-height:32px}
.dora-row{display:flex;gap:4px;align-items:center}
.dora-label{font-size:.6rem;color:var(--gold-lt);letter-spacing:.08em;margin-right:.2rem}
.riichi-stick{width:48px;height:5px;background:linear-gradient(to right,#f5f0e8,#ddd);border-radius:3px;
  box-shadow:0 1px 3px rgba(0,0,0,.4);display:inline-block;position:relative}
.riichi-stick::after{content:'●';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#c0392b;font-size:5px}

/* MELD AREA */
.meld-row{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;min-height:0}

/* HAND AREA */
.hand-zone{flex-shrink:0;background:rgba(0,0,0,.45);border-top:var(--bdr);padding:4px 6px}
.hand-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:3px;padding:0 2px}
.my-name{font-size:.75rem;color:var(--gold);letter-spacing:.08em}
.hand-row{display:flex;gap:3px;align-items:flex-end;flex-wrap:nowrap;overflow-x:auto;justify-content:center;min-height:46px;padding-bottom:2px}
.hand-sep{width:10px;flex-shrink:0}
.tenpai-badge{font-size:.65rem;padding:.15rem .5rem;border-radius:2px;letter-spacing:.08em}
.tenpai-badge.yes{background:rgba(192,57,43,.3);border:1px solid rgba(192,57,43,.6);color:#e74c3c}

/* ACTION BAR */
.action-bar{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;padding:4px;flex-shrink:0}
.ab{padding:.45rem .9rem;border:none;border-radius:2px;cursor:pointer;font-family:'Zen Antique',serif;
  font-size:.85rem;letter-spacing:.12em;transition:all .18s;min-width:60px}
.ab:disabled{opacity:.25;cursor:not-allowed;transform:none!important;filter:none!important}
.ab:not(:disabled):hover{transform:translateY(-1px);filter:brightness(1.15)}
.ab.draw{background:rgba(255,255,255,.1);border:1px solid rgba(201,168,76,.4);color:var(--gold-lt)}
.ab.discard{background:linear-gradient(135deg,#7d6608,#5a4a04);color:#fff;box-shadow:0 3px 8px rgba(125,102,8,.4)}
.ab.tsumo{background:linear-gradient(135deg,#c9a84c,#8b6914);color:#fff;box-shadow:0 3px 8px rgba(201,168,76,.4)}
.ab.ron{background:linear-gradient(135deg,#c0392b,#7b241c);color:#fff;box-shadow:0 3px 8px rgba(192,57,43,.4)}
.ab.riichi{background:linear-gradient(135deg,#7d3c98,#512e5f);color:#fff}
.ab.pon{background:linear-gradient(135deg,#2471a3,#1a4f73);color:#fff}
.ab.chi{background:linear-gradient(135deg,#1e8449,#145a32);color:#fff}
.ab.kan{background:linear-gradient(135deg,#784212,#4a2709);color:#fff}

/* STATUS BAR */
.status-bar{display:flex;justify-content:space-between;align-items:center;
  padding:.25rem .8rem;background:rgba(0,0,0,.6);border-top:var(--bdr);flex-shrink:0}
.status-txt{font-size:.68rem;color:rgba(245,240,232,.55);font-family:'Share Tech Mono',monospace}
.turn-txt{font-size:.68rem;letter-spacing:.1em}
.turn-txt.my{color:var(--gold);animation:pulse 1.2s infinite}
.turn-txt.cpu{color:rgba(245,240,232,.4)}

/* OVERLAYS */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:90;display:none;align-items:center;justify-content:center}
.overlay.show{display:flex}
.modal{background:linear-gradient(135deg,#0d2a1a,#1a4a2e);border:1px solid var(--gold);border-radius:4px;
  padding:1.8rem;max-width:360px;width:92%;box-shadow:0 0 60px rgba(201,168,76,.3);text-align:center}
.modal-title{font-family:'Zen Antique',serif;font-size:2.2rem;color:var(--gold);letter-spacing:.2em;margin-bottom:.8rem}
.yaku-table{width:100%;border-top:var(--bdr);border-bottom:var(--bdr);padding:.7rem 0;margin:.8rem 0;text-align:left}
.yaku-row{display:flex;justify-content:space-between;font-size:.82rem;padding:.15rem 0}
.han{color:var(--gold);font-family:'Share Tech Mono',monospace}
.pts-big{font-family:'Share Tech Mono',monospace;font-size:1.7rem;color:var(--gold-lt);margin:.4rem 0}
.ryukyoku-msg{font-size:.85rem;color:var(--ivory);line-height:1.6;margin:.6rem 0}

/* CHI CHOICE */
.chi-choices{display:flex;gap:.5rem;justify-content:center;flex-wrap:wrap;margin-top:.8rem}
.chi-set{display:flex;gap:2px;cursor:pointer;padding:4px;border:1px solid rgba(201,168,76,.3);border-radius:3px;transition:all .2s}
.chi-set:hover{border-color:var(--gold);background:rgba(201,168,76,.1)}

/* LOG */
.log-box{position:fixed;bottom:0;left:0;width:220px;max-height:120px;overflow-y:auto;
  background:rgba(0,0,0,.7);border-top:var(--bdr);border-right:var(--bdr);padding:.4rem .6rem;
  font-family:'Share Tech Mono',monospace;font-size:.6rem;color:rgba(245,240,232,.5);z-index:10}
.log-entry{padding:.1rem 0;border-bottom:1px solid rgba(255,255,255,.05)}
.log-entry.me{color:var(--gold-lt)}

@keyframes popIn{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.pop{animation:popIn .25s ease}
</style>
</head>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();

socket.on('connect', () => {
  console.log("接続成功:", socket.id);
});

// ── サーバーから参加者リスト更新が届いたら待機画面を同期 ──
socket.on('room-update', (seats) => {
  for (let i = 0; i < 4; i++) {
    if (seats[i]) {
      G.names[i] = seats[i].name;
      G.slotTypes[i] = seats[i].isCpu ? 'cpu' : 'human';
      // 自分の席番号をsocket.idで特定
      if (seats[i].id === socket.id) G.myIdx = i;
    } else {
      G.names[i] = '';
      G.slotTypes[i] = null;
    }
  }
  renderWaitPlayers();
  checkStartReady();
});

// ── ゲーム開始通知（全員に届く） ──
socket.on('game-start', ({ players, hands, deck, dora, uraDoraHidden, turn, dealerIdx, scores, roundNum, honba }) => {
  // 自分の席番号をsocket.idで特定
  const myServerIdx = players.findIndex(p => p && p.id === socket.id);
  if (myServerIdx !== -1) G.myIdx = myServerIdx;

  // 全席のnames/slotTypesをサーバーデータで上書き（nullも含めて完全同期）
  for (let i = 0; i < 4; i++) {
    if (players[i]) {
      G.names[i] = players[i].name;
      G.slotTypes[i] = players[i].isCpu ? 'cpu' : 'human';
    } else {
      G.names[i] = '';
      G.slotTypes[i] = null;
    }
  }

  // サーバーから受け取った盤面状態をセット
  G.hands        = hands;
  G.deck         = deck;
  G.dora         = dora;
  G.uraDoraHidden = uraDoraHidden;
  G.turn         = turn;
  G.dealerIdx    = dealerIdx;
  G.scores       = scores;
  G.roundNum     = roundNum;
  G.honba        = honba;
  startGame();
});

// ── ツモ牌が届いた（全員に通知） ──
socket.on('tile-drawn', ({ playerIdx, tile, deckRemaining }) => {
  // サーバーが正しい手牌を持っているので、クライアントはサーバー通知で追加する
  // （二重追加を防ぐため、自分自身も含めてここでpushする）
  G.hands[playerIdx].push(tile);
  // deckはlengthだけ追跡（配列操作はサーバー側が担う）
  if (!Array.isArray(G.deck)) G.deck = [];
  G.deck.length = deckRemaining;
  G.turn = playerIdx;
  G.phase = 'discard';

  if (playerIdx === G.myIdx) {
    // 自分のツモ
    G.drewTile = true;
    G.selectedIdx = -1;
    renderAll();
    G.selectedIdx = sortHand(G.hands[G.myIdx]).length - 1;
    renderHand();
    enableMyActions();
    setStatus('牌を選んで切るか、和了を宣言してください');
    setTurnTxt(true);
  } else if (G.slotTypes[playerIdx] === 'cpu') {
    // CPUのツモ → ホストがCPUアクションを実行
    G.drewTile = false;
    renderAll();
    disableAllActions();
    setTurnTxt(false);
    setStatus(`${G.names[playerIdx]} がツモりました`);
    if(isHost()){
      setTimeout(() => scheduleCPU(playerIdx), 800);
    }
  } else {
    // 他の人間プレイヤーのツモ → 向こうが判断する
    G.drewTile = false;
    renderAll();
    disableAllActions();
    setTurnTxt(false);
    setStatus(`${G.names[playerIdx]} がツモりました`);
  }
});

socket.on('ryukyoku-server', () => {
  ryukyoku();
});

socket.on('game-action', (data) => {
  // ホストが自分で送った捨て牌はローカル処理済み → スキップ
  if (data.playerIdx === G.myIdx) return;

  // ホストが自分で送ったCPU捨て牌はローカル処理済み → スキップ
  if (G.slotTypes[data.playerIdx] === 'cpu' && isHost()) return;

  // 上記以外（他の人間プレイヤーの捨て牌 or 非ホストへ届いたCPU捨て牌）
  handleRemoteAction(data);
});

// サーバー経由の結果同期（ロン・ツモ）
socket.on('broadcast-result', (data) => {
  // スコアを同期してからオーバーレイを表示
  G.scores = data.scores;
  G.riichiSticks = data.riichiSticks;
  // ホストは既にshowResultOverlayを呼んでいるのでスキップ
  if (isHost()) return;
  showResultOverlay(data.title, data.winner, data.yakuList, data.pts, null);
});

// サーバー経由のターン進行同期
socket.on('claim-pass', ({ fromIdx, nextSeat }) => {
  // ホストは既にpassToNextを呼んでいるのでスキップ
  if (isHost()) return;
  G.waitingTile = null;
  G.waitingFrom = -1;
  disableAllActions();
  kickoffTurn(nextSeat);
});

socket.on('room-full', () => {
  alert('この部屋は満員です（4人）。');
});
</script>

<!-- ── LOBBY ── -->
<div id="screen-lobby" class="screen active">
  <div style="text-align:center">
    <div class="logo-kanji">雀荘</div>
    <div class="deco"></div>
    <div class="logo-sub">ONLINE MAHJONG · オンライン麻雀</div>
  </div>
  <div class="card">
    <div class="card-title">プレイヤー設定</div>
    <label class="lbl">プレイヤー名</label>
    <input type="text" id="inp-name" placeholder="名前を入力..." maxlength="10">
    <button class="btn btn-gold" onclick="createRoom()">新しい部屋を作る</button>
    <div class="divider">または</div>
    <label class="lbl">ルームID</label>
    <input type="text" id="inp-room" placeholder="例: AB12CD" maxlength="8" style="text-transform:uppercase">
    <button class="btn btn-outline" onclick="joinRoom()">部屋に参加する</button>
  </div>
</div>

<!-- ── WAIT ROOM ── -->
<div id="screen-wait" class="screen">
  <div style="text-align:center">
    <div class="logo-kanji" style="font-size:3rem">雀荘</div>
    <div class="logo-sub">WAITING ROOM</div>
  </div>
  <div class="card">
    <div class="card-title">URLを共有して招待</div>
    <div class="share-box"><div class="share-url" id="share-url">-</div><button class="copy-btn" onclick="copyURL()">コピー</button></div>
    <div class="lbl" style="text-align:center;margin-bottom:.3rem">ROOM ID</div>
    <div class="room-id-big" id="disp-room-id">-</div>

<script>
'use strict';
// ═══════════════════════════════════════════════════════
//  TILE SYSTEM
// ═══════════════════════════════════════════════════════
// Tile: { suit:'man'|'pin'|'sou'|'honor', n:0-8(man/pin/sou),0-6(honor) }
// Unique ID for DOM: suit+n (e.g. "man3")
const SUITS = ['man','pin','sou','honor'];
const HONOR_NAMES = ['東','南','西','北','白','發','中'];
const SUIT_LABELS = {man:'m',pin:'p',sou:'s',honor:'z'};

function tileKey(t){ return t.suit+t.n; }
function tileText(t){
  if(t.suit==='honor') return HONOR_NAMES[t.n];
  return (t.n+1)+(t.suit==='man'?'m':t.suit==='pin'?'p':'s');
}
function tileSuit(t){ return t.suit; }
function tileEl(t,cls,extra=''){
  const txt = tileText(t);
  return `<div class="tile ${cls} ${t.suit}" data-k="${tileKey(t)}" ${extra}>${txt}</div>`;
}

// Build full deck (136 tiles, 4 copies each)
function buildDeck(){
  const d=[];
  for(const suit of ['man','pin','sou'])
    for(let n=0;n<9;n++) for(let c=0;c<4;c++) d.push({suit,n,copy:c});
  for(let n=0;n<7;n++) for(let c=0;c<4;c++) d.push({suit:'honor',n,copy:c});
  return d;
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; }

// Sort hand: man→pin→sou→honor, then by n
function sortHand(h){
  const O={man:0,pin:1,sou:2,honor:3};
  return [...h].sort((a,b)=>O[a.suit]-O[b.suit]||a.n-b.n);
}

// ═══════════════════════════════════════════════════════
//  WIN DETECTION ENGINE
// ═══════════════════════════════════════════════════════
// Returns array of winning decompositions, each = {pairs, mentsu[]}
// mentsu: {type:'shuntsu'|'koutsu', tiles:[t,t,t]}

function findWins(hand14){
  // Group by suit+n
  const count = {};
  for(const t of hand14){
    const k=tileKey(t);
    count[k]=(count[k]||0)+1;
  }
  
  const results=[];
  
  // Try each pair
  const keys = Object.keys(count);
  for(const pk of keys){
    if(count[pk]<2) continue;
    const pair = parseTileKey(pk);
    const rem = {...count};
    rem[pk]-=2; if(rem[pk]===0) delete rem[pk];
    const mentsuSets = extractMentsu(rem);
    if(mentsuSets!==null){
      results.push({pair, mentsu:mentsuSets});
    }
  }
  
  // Chiitoitsu (7 pairs)
  const pairs=keys.filter(k=>count[k]>=2);
  if(pairs.length===7 && hand14.length===14){
    results.push({type:'chiitoitsu', pairs:pairs.map(parseTileKey)});
  }
  
  // Kokushi
  if(isKokushi(count)) results.push({type:'kokushi'});
  
  return results;
}

function parseTileKey(k){
  // "man3" → {suit:'man',n:3}
  for(const s of SUITS){
    if(k.startsWith(s)) return {suit:s,n:parseInt(k.slice(s.length))};
  }
}

function extractMentsu(count){
  // Returns flat list of mentsu if extractable, else null
  const rem = {...count};
  const keys = Object.keys(rem);
  if(keys.length===0) return [];
  
  // Find first non-zero key
  let firstKey=null;
  for(const k of keys){ if(rem[k]>0){firstKey=k;break;} }
  if(!firstKey) return [];
  
  const t = parseTileKey(firstKey);
  const results=[];
  
  // Try koutsu
  if(rem[firstKey]>=3){
    rem[firstKey]-=3; if(rem[firstKey]===0) delete rem[firstKey];
    const sub = extractMentsu(rem);
    if(sub!==null) return [{type:'koutsu',tiles:[t,t,t]},...sub];
    // Restore
    rem[firstKey]=(rem[firstKey]||0)+3;
  }
  
  // Try shuntsu (only for man/pin/sou)
  if(t.suit!=='honor' && t.n<=6){
    const t2={suit:t.suit,n:t.n+1}, t3={suit:t.suit,n:t.n+2};
    const k2=tileKey(t2), k3=tileKey(t3);
    if((rem[k2]||0)>=1 && (rem[k3]||0)>=1){
      rem[firstKey]-=1; if(rem[firstKey]===0) delete rem[firstKey];
      rem[k2]-=1; if(rem[k2]===0) delete rem[k2];
      rem[k3]-=1; if(rem[k3]===0) delete rem[k3];
      const sub = extractMentsu(rem);
      if(sub!==null) return [{type:'shuntsu',tiles:[t,t2,t3]},...sub];
      rem[firstKey]=(rem[firstKey]||0)+1;
      rem[k2]=(rem[k2]||0)+1;
      rem[k3]=(rem[k3]||0)+1;
    }
  }
  
  return null;
}

function isKokushi(count){
  const terminals=['man0','man8','pin0','pin8','sou0','sou8',
    'honor0','honor1','honor2','honor3','honor4','honor5','honor6'];
  // Need all 13 terminals, at least one pair
  let hasPair=false;
  for(const k of terminals){
    if(!count[k]) return false;
    if(count[k]>=2) hasPair=true;
  }
  return hasPair;
}

// Tenpai: return winning tiles (shanpon etc.) — which tiles complete the hand
function findWaiting(hand13){
  const waiting=[];
  // Try all possible incoming tiles
  const candidates = buildAllTileTypes();
  for(const t of candidates){
    const h14=[...hand13, t];
    if(findWins(h14).length>0) waiting.push(t);
  }
  return waiting;
}

function buildAllTileTypes(){
  const types=[];
  for(const s of ['man','pin','sou']) for(let n=0;n<9;n++) types.push({suit:s,n,copy:0});
  for(let n=0;n<7;n++) types.push({suit:'honor',n,copy:0});
  return types;
}

// ═══════════════════════════════════════════════════════
//  YAKU ENGINE
// ═══════════════════════════════════════════════════════
// Returns [{name, han}]  (double-yakuman not implemented, manzu/etc. simplified)
function calcYaku(decomp, ctx){
  // ctx: {riichi, tsumo, meldCount, seatWind, roundWind, lastTile, isLastDraw}
  const {riichi,tsumo,meldCount,seatWind,roundWind,lastTile} = ctx;
  const closed = meldCount===0;
  const yakuList=[];

  if(decomp.type==='chiitoitsu'){
    yakuList.push({name:'七対子',han:2});
    if(riichi) yakuList.push({name:'立直',han:1});
    if(tsumo&&closed) yakuList.push({name:'門前清自摸和',han:1});
    return yakuList;
  }
  if(decomp.type==='kokushi'){
    yakuList.push({name:'国士無双',han:13});
    return yakuList;
  }

  const {pair, mentsu} = decomp;

  // Riichi
  if(riichi) yakuList.push({name:'立直',han:1});

  // Menzen tsumo
  if(tsumo&&closed) yakuList.push({name:'門前清自摸和',han:1});

  // Tanyao (all simples: 2-8, no terminals/honors)
  const allTiles=[pair,...mentsu.flatMap(m=>m.tiles)];
  if(allTiles.every(t=>t.suit!=='honor'&&t.n>=1&&t.n<=7))
    yakuList.push({name:'断么九',han:1});

  // Pinfu (all shuntsu, pair not yakuhai, last tile completes shuntsu in 2-way wait, menzzen)
  if(closed && mentsu.every(m=>m.type==='shuntsu') && !isYakuhai(pair,seatWind,roundWind)){
    yakuList.push({name:'平和',han:1});
  }

  // Iipeiko (two identical shuntsu, closed)
  if(closed){
    const shunts = mentsu.filter(m=>m.type==='shuntsu');
    let iipeiko=false;
    for(let i=0;i<shunts.length&&!iipeiko;i++)
      for(let j=i+1;j<shunts.length&&!iipeiko;j++)
        if(shunts[i].tiles.every((t,k)=>tileKey(t)===tileKey(shunts[j].tiles[k])))
          iipeiko=true;
    if(iipeiko) yakuList.push({name:'一盃口',han:1});
  }

  // Yakuhai (value tiles)
  for(const m of mentsu){
    if(m.type==='koutsu'){
      const t=m.tiles[0];
      if(t.suit==='honor'){
        if(t.n===4) yakuList.push({name:'白',han:1});
        else if(t.n===5) yakuList.push({name:'發',han:1});
        else if(t.n===6) yakuList.push({name:'中',han:1});
        else if(t.n===seatWind) yakuList.push({name:HONOR_NAMES[t.n]+'(門風)',han:1});
        else if(t.n===roundWind) yakuList.push({name:HONOR_NAMES[t.n]+'(場風)',han:1});
      }
    }
  }

  // Sanshoku doukou
  const koutsuNums=mentsu.filter(m=>m.type==='koutsu'&&m.tiles[0].suit!=='honor').map(m=>m.tiles[0].n);
  const kSet=new Set(koutsuNums);
  for(const n of kSet){
    const suits=mentsu.filter(m=>m.type==='koutsu'&&m.tiles[0].n===n).map(m=>m.tiles[0].suit);
    if(['man','pin','sou'].every(s=>suits.includes(s))) yakuList.push({name:'三色同刻',han:2});
  }

  // Sanshoku doujun
  const shunts=mentsu.filter(m=>m.type==='shuntsu');
  const shByN={};
  for(const m of shunts){
    const n=m.tiles[0].n;
    shByN[n]=(shByN[n]||new Set()).add(m.tiles[0].suit);
  }
  for(const [n,suits] of Object.entries(shByN)){
    if(['man','pin','sou'].every(s=>suits.has(s)))
      yakuList.push({name:'三色同順',han:closed?2:1});
  }

  // Ittsu (1-2-3, 4-5-6, 7-8-9 in same suit)
  for(const suit of ['man','pin','sou']){
    const ns = shunts.filter(m=>m.tiles[0].suit===suit).map(m=>m.tiles[0].n);
    if([0,3,6].every(n=>ns.includes(n))) yakuList.push({name:'一気通貫',han:closed?2:1});
  }

  // Toitoi (all koutsu, open ok)
  if(mentsu.every(m=>m.type==='koutsu')) yakuList.push({name:'対々和',han:2});

  // Sanankou (3 concealed koutsu)
  const concealedKoutsu = mentsu.filter(m=>m.type==='koutsu').length; // simplified
  if(concealedKoutsu>=3&&closed) yakuList.push({name:'三暗刻',han:2});

  // Honitsu / Chinitsu
  const nonHonorSuits=[...new Set(allTiles.filter(t=>t.suit!=='honor').map(t=>t.suit))];
  const hasHonor=allTiles.some(t=>t.suit==='honor');
  if(nonHonorSuits.length===1){
    if(!hasHonor) yakuList.push({name:'清一色',han:closed?6:5});
    else yakuList.push({name:'混一色',han:closed?3:2});
  }

  // Tsumo (no-yaku tsumo still adds 1 han if closed)
  // Already added above

  return yakuList;
}

function isYakuhai(t,seatWind,roundWind){
  if(t.suit!=='honor') return false;
  return t.n>=4||t.n===seatWind||t.n===roundWind;
}

// ═══════════════════════════════════════════════════════
//  SCORING
// ═══════════════════════════════════════════════════════
// Returns points for winner from each loser (simplified mangan table)
function calcPoints(yakuList, decomp, tsumo){
  const totalHan = yakuList.reduce((s,y)=>s+y.han,0);
  
  if(totalHan>=13) return {name:'役満',base:8000,tsumo};
  if(totalHan>=8)  return {name:'三倍満',base:6000*3/4|0,tsumo};  // simplified
  if(totalHan>=6)  return {name:'倍満',base:8000/2|0,tsumo};
  if(totalHan>=5)  return {name:'満貫',base:8000/4|0,tsumo};
  
  // Fu calc (simplified: use 30 fu base)
  let fu = decomp?.type==='chiitoitsu' ? 25 : 30;
  const han = Math.min(totalHan,4);
  // Basic points formula: fu × 2^(han+2), rounded up to nearest 100
  let basic = fu * Math.pow(2, han+2);
  basic = Math.ceil(basic/100)*100;
  
  // Cap at mangan
  basic = Math.min(basic, 2000);
  
  return {name: totalHan+'飜'+fu+'符', base:basic, tsumo};
}

// Payment: returns {winner gains, each loser pays}
function calcPayment(pts, tsumo, isDealer){
  const b = pts.base;
  if(tsumo){
    const dealerPay = Math.ceil(b*2/100)*100;
    const nonDealerPay = Math.ceil(b/100)*100;
    return {dealerPay, nonDealerPay, totalGain: isDealer ? dealerPay*3 : dealerPay+nonDealerPay*2};
  } else {
    const ron = Math.ceil(b*(isDealer?6:4)/100)*100;
    return {ron, totalGain:ron};
  }
}

function genRoomId(){ return Math.random().toString(36).substr(2,6).toUpperCase(); }
function getShareURL(id){ const u=new URL(location.href.split('?')[0]); u.searchParams.set('r',id); return u.toString(); }
function checkURLJoin(){ const r=new URLSearchParams(location.search).get('r'); if(r) document.getElementById('inp-room').value=r; }

}

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-game').classList.remove('active');
  const el=document.getElementById(id);
  if(el){ el.classList.add('active'); }
}

function createRoom(){
  const name = document.getElementById('inp-name').value.trim();
  if(!name){alert('プレイヤー名を入力してください');return;}
  G.names[0]=name;
  G.roomId=genRoomId();
  G.myIdx=0;
  // サーバーにルーム作成 & 参加を通知
  socket.emit("join-room", { roomId: G.roomId, name });
  enterWait(true);
}

function joinRoom(){
  const name=document.getElementById('inp-name').value.trim();
  const rid=document.getElementById('inp-room').value.trim().toUpperCase();
  if(!name){alert('プレイヤー名を入力してください');return;}
  if(!rid){alert('ルームIDを入力してください');return;}
  G.names[0]=name;
  G.roomId=rid;
  // myIdxはroom-updateで確定するまで仮置き
  socket.emit("join-room", {
    roomId: G.roomId,
    name: G.names[0]
  });
  enterWait(false);
}

// G.slotTypes: 'human'|'cpu'|null for each seat
function enterWait(isHost){
  history.pushState({},'',getShareURL(G.roomId));
  document.getElementById('share-url').textContent=getShareURL(G.roomId);
  document.getElementById('disp-room-id').textContent=G.roomId;
  // ホストの場合だけローカルで初期化（room-updateが来るまでの暫定表示）
  if(isHost){
    G.slotTypes=['human',null,null,null];
    G.names=[document.getElementById('inp-name').value.trim()||'あなた','','',''];
  }
  // 招待で入った場合はroom-updateが来るまで空表示
  renderWaitPlayers();
  checkStartReady();
  showScreen('screen-wait');
}

function fillWithCPU(){
  const cpuNames=['さくらCPU','たろうCPU','はなCPU','けんじCPU'];
  let cpuIdx=0;
  for(let i=0;i<4;i++){
    if(G.slotTypes[i]===null){
      G.slotTypes[i]='cpu';
      while(cpuIdx<cpuNames.length && G.names.includes(cpuNames[cpuIdx])) cpuIdx++;
      G.names[i]=cpuNames[cpuIdx]||`CPU${i}`;
      cpuIdx++;
    }
  }
  // サーバーとその他クライアントに通知
  socket.emit("fill-cpu", {
    roomId: G.roomId,
    names: G.names,
    slotTypes: G.slotTypes
  });
  renderWaitPlayers();
  checkStartReady();
}

function checkStartReady(){
  const allFilled=G.slotTypes.every(t=>t!==null);
  const waitMsg=document.getElementById('wait-msg');
  const btnStart=document.getElementById('btn-start');
  const btnFill=document.getElementById('btn-fill-cpu');
  if(allFilled){
    waitMsg.textContent='全員揃いました！';
    btnStart.style.display='block';
    btnFill.style.display='none';
  } else {
    const empty=G.slotTypes.filter(t=>t===null).length;
    waitMsg.innerHTML=`あと${empty}人を待っています<span class="dots"><span>.</span><span>.</span><span>.</span></span>`;
    btnStart.style.display='none';
    btnFill.style.display='block';
  }
}

function renderWaitPlayers(){
  const winds=['東家','南家','西家','北家'];
  const avs=['🀄','⛩️','🏮','🎯'];
  const g=document.getElementById('player-grid');
  g.innerHTML='';
  for(let i=0;i<4;i++){
    const name=G.names[i];
    const type=G.slotTypes?G.slotTypes[i]:null;
    const isMe=i===G.myIdx;
    const filled=type!==null;
    const d=document.createElement('div');
    d.className='p-slot'+(filled?' filled':'')+(isMe?' me':'');
    if(filled){
      let badge='';
      if(type==='cpu') badge=`<div class="slot-type-badge cpu">CPU</div>`;
      else if(isMe) badge=`<div class="slot-type-badge human">あなた</div>`;
      else badge=`<div class="slot-type-badge human">人間</div>`;
      d.innerHTML=`<div class="p-avatar">${avs[i]}</div><div class="p-name">${name}</div><div class="p-wind">${winds[i]}</div>${badge}`;
    } else {
      d.innerHTML=`<div class="p-empty">空席<br>待機中<span class="dots"><span>.</span><span>.</span><span>.</span></span></div><div class="slot-type-badge waiting">空き</div>`;
    }
    g.appendChild(d);
  }
}

// ═══════════════════════════════════════════════════════
//  REMOTE ACTION HANDLER（他プレイヤーの操作を受信）
// ═══════════════════════════════════════════════════════
function handleRemoteAction(data){
  const pidx = data.playerIdx;
  if(data.type==='discard'){
    if(pidx === G.myIdx) return; // 自分の捨て牌は既に処理済み
    const tile = data.tile;

    // 相手の手牌から捨てた牌を削除
    const idx = G.hands[pidx]?.findIndex(t => tileKey(t) === tileKey(tile));
    if(idx >= 0) G.hands[pidx].splice(idx, 1);

    G.discards[pidx] = G.discards[pidx] || [];
    G.discards[pidx].push(tile);
    G.waitingTile = tile;
    G.waitingFrom = pidx;
    // サーバーから届いたturnを使う（なければ+1）
    G.turn = data.turn !== undefined ? data.turn : (pidx + 1) % 4;
    G.phase = 'claim';
    G.drewTile = false;

    renderAll();
    showLog(`${G.names[pidx]}: ${tileText(tile)} を捨てた`);
    setStatus(`${G.names[pidx]} が ${tileText(tile)} を切りました`);

    // ロン可能かを自分用にチェック（ボタン有効化）
    setTimeout(() => checkMyClaimsOnly(pidx, tile), 400);

    // ホストはCPUクレームとターン進行も担当
    if(isHost()){
      setTimeout(() => checkClaims(pidx, tile), 400);
    }
  }
}

// 自分のロンボタン有効化のみ（ターン進行なし）
function checkMyClaimsOnly(fromIdx, tile){
  const handPlus=[...G.hands[G.myIdx], tile];
  const wins=findWins(handPlus);
  if(wins.length>0){
    const ctx=buildCtx(G.myIdx,false);
    const yakuList=calcYaku(wins[0],ctx);
    if(yakuList.length>0){
      G.waitingTile=tile;
      G.waitingFrom=fromIdx;
      document.getElementById('btn-ron').disabled=false;
      setStatus(`ロン可能！ (${tileText(tile)})`);
      G.ronTimeout=setTimeout(()=>{
        if(G.phase==='claim'){
          document.getElementById('btn-ron').disabled=true;
          G.waitingTile=null;
        }
      },5000);
    }
  }
}

// ═══════════════════════════════════════════════════════
//  GAME INIT
// ═══════════════════════════════════════════════════════
function startGame(){
  // リセット
  G.melds        = [[], [], [], []];
  G.discards     = [[], [], [], []];
  G.riichi       = [false, false, false, false];
  G.riichiTile   = [null, null, null, null];
  G.riichiSticks = 0;
  G.drewTile     = false;
  G.selectedIdx  = -1;
  G.waitingTile  = null;
  G.waitingFrom  = -1;
  G.phase        = 'draw';

  // サーバーから受け取った deck は配列だが、クライアントはlengthだけ追跡する
  // 配列の実体はサーバーが持ち、クライアントはlengthプロキシを使う
  if(Array.isArray(G.deck)){
    // game-startで配列が来た場合はlength追跡用オブジェクトに変換
    const len = G.deck.length;
    G.deck = [];
    G.deck.length = len;
  }

  showScreen('screen-game');
  document.getElementById('screen-game').classList.add('active');
  updateHeader();
  disableAllActions();
  renderAll();

  kickoffTurn(G.dealerIdx);
}

// ターン開始を一元管理
function kickoffTurn(seatIdx){
  G.turn = seatIdx;
  G.phase = 'draw';

  if(seatIdx === G.myIdx){
    document.getElementById('btn-draw').disabled = false;
    setStatus('ツモ牌を引いてください');
    setTurnTxt(true);
  } else if(G.slotTypes[seatIdx] === 'cpu'){
    setTurnTxt(false);
    setStatus(`${G.names[seatIdx]} のツモ番`);
    if(isHost()){
      setTimeout(() => socket.emit("draw-tile", { roomId: G.roomId, forSeat: seatIdx }), 600+Math.random()*400);
    }
  } else {
    setTurnTxt(false);
    setStatus(`${G.names[seatIdx]} のツモ番`);
  }
}

// ホスト判定: 最若番の人間プレイヤーが自分か
function isHost(){
  const humanSeats = [0,1,2,3].filter(i => G.slotTypes[i]==='human');
  return humanSeats.length > 0 && humanSeats[0] === G.myIdx;
}

// オンライン版: サーバーに次の局開始を要求する（ホストのみ送信）
function requestNextRound(){
  if(isHost()){
    socket.emit("next-round", {
      roomId: G.roomId,
      dealerIdx: G.dealerIdx,
      roundNum: G.roundNum,
      scores: G.scores,
      honba: G.honba,
    });
  }
}

    div.textContent=tileText(t);
    div.dataset.idx=i;

function doraFromIndicator(t){
  if(t.suit==='honor'){
    // 東→南→西→北→東, 白→發→中→白
    if(t.n<=3) return {suit:'honor',n:(t.n+1)%4};
    return {suit:'honor',n:t.n===6?4:(t.n+1)};
  }
  return {suit:t.suit, n:(t.n+1)%9};
}

// ═══════════════════════════════════════════════════════
//  PLAYER ACTIONS
// ═══════════════════════════════════════════════════════
function selectTile(i){
  if(G.turn!==G.myIdx||G.phase!=='discard') return;
  const hand=sortHand(G.hands[G.myIdx]);
  G.selectedIdx=i;
  renderHand();
  
  // Enable/disable buttons
  document.getElementById('btn-discard').disabled=false;
  
  // Tsumo check (only after drawing)
  if(G.drewTile){
    const wins=findWins(hand);
    document.getElementById('btn-tsumo').disabled=wins.length===0;
  }
  
  // Riichi check
  if(!G.riichi[G.myIdx]&&G.melds[G.myIdx].length===0&&G.hands[G.myIdx].length===14){
    // Try discarding selected, check tenpai
    const testHand=hand.filter((_,j)=>j!==i);
    const waiting=findWaiting(testHand);
    document.getElementById('btn-riichi').disabled=waiting.length===0;
  }
}

function actionDraw(){
  if(G.turn!==G.myIdx||G.phase!=='draw') return;
  // サーバーにツモ要求を送る。tile-drawnイベントで全員の手牌が更新される
  socket.emit("draw-tile", { roomId: G.roomId, forSeat: G.myIdx });
  document.getElementById('btn-draw').disabled = true;
  setStatus('ツモ中...');
}

function actionDiscard(){
  if(G.selectedIdx<0) return;
  const hand=sortHand(G.hands[G.myIdx]);
  const tile=hand[G.selectedIdx];
  
  // Remove from actual hand
  const realIdx=G.hands[G.myIdx].findIndex((t,i)=>tileKey(t)===tileKey(tile)&&!G.hands[G.myIdx].slice(0,i).some(x=>tileKey(x)===tileKey(tile)));
  // Find the tile (handle duplicates carefully)
  let found=-1;
  for(let i=0;i<G.hands[G.myIdx].length;i++){
    if(tileKey(G.hands[G.myIdx][i])===tileKey(tile)){found=i;break;}
  }
  if(found<0) return;
  
  const discarded=G.hands[G.myIdx].splice(found,1)[0];
  G.discards[G.myIdx].push(discarded);

  socket.emit("game-action", {
    roomId: G.roomId,
    data: {
      type: "discard",
      playerIdx: G.myIdx,
      tile: discarded
    }
  });
  G.waitingTile=discarded;
  G.waitingFrom=G.myIdx;
  G.drewTile=false;
  G.selectedIdx=-1;
  G.phase='claim';
  
  disableAllActions();
  showLog(`${G.names[G.myIdx]}: ${tileText(discarded)} を捨てた`,'me');
  renderAll();
  
  // ホストは自分が捨てた後もCPUクレームとターン進行を担当
  // 非ホストはホストがdraw-tileを送るのを待つ（ロンのみ自分でチェック）
  if(isHost()){
    setTimeout(()=>checkClaims(G.myIdx, discarded), 400);
  }
  // 自分がロンされることはないので追加チェック不要
}

function actionTsumo(){
  const hand=sortHand(G.hands[G.myIdx]);
  const wins=findWins(hand);
  if(wins.length===0) return;
  
  const ctx=buildCtx(G.myIdx,true);
  const yakuList=calcYaku(wins[0],ctx);
  if(yakuList.length===0){ alert('役がありません'); return; }
  
  const pts=calcPoints(yakuList,wins[0],true);
  const pay=calcPayment(pts,true,G.myIdx===G.dealerIdx);
  
  // Apply payments
  for(let p=0;p<4;p++){
    if(p===G.myIdx) G.scores[p]+=pay.totalGain+G.riichiSticks*1000;
    else G.scores[p]-=(G.myIdx===G.dealerIdx?pay.dealerPay:p===G.dealerIdx?pay.dealerPay:pay.nonDealerPay);
  }
  G.riichiSticks=0;
  showResultOverlay('ツモ！',G.names[G.myIdx]+'のツモ和了',yakuList,pay.totalGain,wins[0]);
}

function actionRon(){
  if(!G.waitingTile) return;
  clearTimeout(G.ronTimeout);
  const hand=[...G.hands[G.myIdx], G.waitingTile];
  const wins=findWins(hand);
  if(wins.length===0) return;
  
  const ctx=buildCtx(G.myIdx,false);
  const yakuList=calcYaku(wins[0],ctx);
  if(yakuList.length===0){ alert('役がありません'); return; }
  
  const pts=calcPoints(yakuList,wins[0],false);
  const pay=calcPayment(pts,false,G.myIdx===G.dealerIdx);
  
  G.scores[G.myIdx]+=pay.totalGain+G.riichiSticks*1000;
  G.scores[G.waitingFrom]-=pay.ron;
  G.riichiSticks=0;
  showResultOverlay('ロン！',G.names[G.waitingFrom]+'の捨て牌でロン',yakuList,pay.totalGain,wins[0]);
}

function actionRiichi(){
  if(G.selectedIdx<0) return;
  const hand=sortHand(G.hands[G.myIdx]);
  const testHand=hand.filter((_,j)=>j!==G.selectedIdx);
  const waiting=findWaiting(testHand);
  if(waiting.length===0){ alert('テンパイしていません'); return; }
  
  G.riichi[G.myIdx]=true;
  G.scores[G.myIdx]-=1000;
  G.riichiSticks++;
  G.riichiTile[G.myIdx]=hand[G.selectedIdx];
  showLog(`${G.names[G.myIdx]}: リーチ！`,'me');
  
  // Discard
  actionDiscard();
  renderScores();
  renderCenter();
}

function actionPon(){
  if(!G.waitingTile) return;
  const t=G.waitingTile;
  const from=G.waitingFrom;
  
  // Check we have 2 of this tile
  const matches=G.hands[G.myIdx].filter(x=>tileKey(x)===tileKey(t));
  if(matches.length<2) return;
  
  // Remove 2 from hand
  let removed=0;
  G.hands[G.myIdx]=G.hands[G.myIdx].filter(x=>{
    if(removed<2&&tileKey(x)===tileKey(t)){removed++;return false;}
    return true;
  });
  
  // Add meld
  G.melds[G.myIdx].push({type:'pon',tiles:[t,matches[0],matches[1]]});
  G.waitingTile=null;
  G.turn=G.myIdx;
  G.phase='discard';
  G.drewTile=false;
  G.selectedIdx=-1;
  
  disableAllActions();
  document.getElementById('btn-discard').disabled=false;
  renderAll();
  showLog(`${G.names[G.myIdx]}: ポン！`,'me');
  setStatus('捨て牌を選んでください');
}

function actionChi(){
  if(!G.waitingTile) return;
  const t=G.waitingTile;
  const from=G.waitingFrom;
  
  // Find possible chi sets
  const chiSets=findChiSets(G.hands[G.myIdx],t);
  if(chiSets.length===0) return;
  
  if(chiSets.length===1){
    executeChi(chiSets[0]);
  } else {
    // Show choice
    showChiChoice(chiSets);
  }
}

function findChiSets(hand, t){
  if(t.suit==='honor') return [];
  const results=[];
  // [t-2,t-1,t], [t-1,t,t+1], [t,t+1,t+2]
  const offsets=[[-2,-1],[-1,1],[1,2]];
  for(const [a,b] of offsets){
    const ta={suit:t.suit,n:t.n+a}, tb={suit:t.suit,n:t.n+b};
    if(ta.n<0||ta.n>8||tb.n<0||tb.n>8) continue;
    if(hand.some(x=>tileKey(x)===tileKey(ta))&&hand.some(x=>tileKey(x)===tileKey(tb))){
      results.push([ta,tb,t].sort((a,b)=>a.n-b.n));
    }
  }
  return results;
}

function showChiChoice(chiSets){
  const el=document.getElementById('chi-choices');
  el.innerHTML='';
  for(const set of chiSets){
    const div=document.createElement('div');
    div.className='chi-set';
    for(const t of set){
      const d=document.createElement('div');
      d.className=`tile tm ${t.suit}`;
      d.textContent=tileText(t);
      div.appendChild(d);
    }
    div.onclick=()=>{ hideOverlay('ov-chi'); executeChi(set); };
    el.appendChild(div);
  }
  showOverlay('ov-chi');
}

function executeChi(set){
  const t=G.waitingTile;
  // Remove the two non-waitingTile tiles from hand
  const toRemove=set.filter(x=>!(tileKey(x)===tileKey(t)&&set.indexOf(x)===set.findLastIndex(s=>tileKey(s)===tileKey(t))));
  for(const r of toRemove){
    const idx=G.hands[G.myIdx].findIndex(x=>tileKey(x)===tileKey(r));
    if(idx>=0) G.hands[G.myIdx].splice(idx,1);
  }
  G.melds[G.myIdx].push({type:'chi',tiles:set});
  G.waitingTile=null;
  G.turn=G.myIdx;
  G.phase='discard';
  G.drewTile=false;
  G.selectedIdx=-1;
  
  disableAllActions();
  document.getElementById('btn-discard').disabled=false;
  renderAll();
  showLog(`${G.names[G.myIdx]}: チー！`,'me');
  setStatus('捨て牌を選んでください');
}

function actionKan(){
  // Simplified: ankan only
  const hand=G.hands[G.myIdx];
  const counts={};
  for(const t of hand){ const k=tileKey(t); counts[k]=(counts[k]||0)+1; }
  const kanKey=Object.keys(counts).find(k=>counts[k]===4);
  if(!kanKey) return;
  
  const tiles=hand.filter(t=>tileKey(t)===kanKey);
  G.hands[G.myIdx]=hand.filter(t=>tileKey(t)!==kanKey);
  G.melds[G.myIdx].push({type:'kan',tiles});
  
  // Add dora (サーバー側のdeck管理に合わせ、ドラはgame-startで受け取る分のみ管理)
  // カン後のドラ追加はサーバーへdraw-tileを送った後、tile-drawnで来る牌の前にドラが増える
  // ここではローカルのdora配列は変えず、サーバーに任せる
  
  showLog(`${G.names[G.myIdx]}: カン！`,'me');
  renderAll();
  // Draw rinshan
  // カン後のツモもサーバー経由
  socket.emit("draw-tile", { roomId: G.roomId, forSeat: G.myIdx });
}

// ═══════════════════════════════════════════════════════
//  CLAIM CHECK (after discard)
// ═══════════════════════════════════════════════════════
function checkClaims(fromIdx, tile){
  // Check each player for ron/pon/chi
  // Priority: ron > pon/kan > chi
  
  let ronPlayers=[];
  let ponPlayers=[];
  let chiPlayer=-1;
  
  for(let p=0;p<4;p++){
    if(p===fromIdx) continue;
    
    // Ron check
    const handPlus=[...G.hands[p], tile];
    const wins=findWins(handPlus);
    if(wins.length>0){
      const ctx=buildCtx(p,false);
      const yakuList=calcYaku(wins[0],ctx);
      if(yakuList.length>0) ronPlayers.push({p,wins,yakuList});
    }
    
    // Pon check (need 2 in hand)
    const matchCount=G.hands[p].filter(x=>tileKey(x)===tileKey(tile)).length;
    if(matchCount>=2) ponPlayers.push(p);
    
    // Chi check (only left player = fromIdx+1)
    if(p===(fromIdx+1)%4&&tile.suit!=='honor'){
      const chiSets=findChiSets(G.hands[p],tile);
      if(chiSets.length>0) chiPlayer=p;
    }
  }
  
  // CPU auto-claim or present options to human
  
  // Handle ron first
  if(ronPlayers.length>0){
    // 自分がロンできるか
    const myRon=ronPlayers.find(r=>r.p===G.myIdx);
    if(myRon){
      G.waitingTile=tile;
      G.waitingFrom=fromIdx;
      document.getElementById('btn-ron').disabled=false;
      setStatus(`ロン！ (${tileText(tile)})`);
      // CPUのロンがなければプレイヤーの判断を待つ
      const cpuRon=ronPlayers.find(r=>r.p!==G.myIdx && G.slotTypes[r.p]==='cpu');
      if(!cpuRon) return;
    }
    // CPUのロン → ホストのみ処理
    if(isHost()){
      for(const {p,wins,yakuList} of ronPlayers){
        if(p===G.myIdx) continue;
        if(G.slotTypes[p]!=='cpu') continue;
        const pts=calcPoints(yakuList,wins[0],false);
        const pay=calcPayment(pts,false,p===G.dealerIdx);
        G.scores[p]+=pay.totalGain+G.riichiSticks*1000;
        G.scores[fromIdx]-=pay.ron;
        G.riichiSticks=0;
        showResultOverlay('ロン！',G.names[fromIdx]+'の捨て牌でロン('+G.names[p]+')',yakuList,pay.totalGain,wins[0]);
        return;
      }
    }
    if(myRon) return; // 自分のロン待ち中
    passToNext(fromIdx);
    return;
  }
  
  // Show pon/chi options to human if applicable
  const myPon=ponPlayers.includes(G.myIdx);
  const myChi=chiPlayer===G.myIdx;
  
  // CPU pon (random chance 40%) - ホストのみ処理
  if(isHost()){
    for(const p of ponPlayers){
      if(p===G.myIdx) continue;
      if(G.slotTypes[p]==='cpu'&&Math.random()<0.4){
        cpuPon(p,tile,fromIdx);
        return;
      }
    }
    // CPU chi (random chance 30%)
    if(chiPlayer>=0&&chiPlayer!==G.myIdx&&G.slotTypes[chiPlayer]==='cpu'&&Math.random()<0.3){
      cpuChi(chiPlayer,tile);
      return;
    }
  }
  
  G.waitingTile=tile;
  G.waitingFrom=fromIdx;
  if(myPon) document.getElementById('btn-pon').disabled=false;
  if(myChi) document.getElementById('btn-chi').disabled=false;
  if(myPon||myChi){
    setStatus(`${tileText(tile)} を鳴きますか？`);
    // 2秒後に自動パス
    setTimeout(()=>{
      if(G.phase==='claim'){
        document.getElementById('btn-pon').disabled=true;
        document.getElementById('btn-chi').disabled=true;
        G.waitingTile=null;
        // ホストのみサーバーへpass通知してターン進行
        if(isHost()) passToNext(fromIdx);
      }
    },2000);
    return;
  }

  // ホストのみpassToNextでターンを進める
  if(isHost()){
    passToNext(fromIdx);
  }
}

function passToNext(fromIdx){
  G.waitingTile=null;
  G.waitingFrom=-1;
  disableAllActions();
  const nextSeat=(fromIdx+1)%4;
  // ホストがサーバー経由で全員にターン進行を通知
  socket.emit("claim-pass", { roomId: G.roomId, fromIdx });
  kickoffTurn(nextSeat);
}

// ═══════════════════════════════════════════════════════
//  CPU LOGIC
// ═══════════════════════════════════════════════════════
function scheduleCPU(pidx){
  if(!isHost()) return; // ホストのみCPUを動かす
  clearTimeout(G.cpuTimer);
  G.cpuTimer=setTimeout(()=>cpuAction(pidx), 800+Math.random()*600);
}

function cpuAction(pidx){
  if(G.turn!==pidx||G.phase!=='discard') return;
  
  const hand=G.hands[pidx];
  const tileToDiscard=cpuChooseDiscard(hand);
  
  // Check tsumo
  const wins=findWins(hand);
  if(wins.length>0){
    const ctx=buildCtx(pidx,true);
    const yakuList=calcYaku(wins[0],ctx);
    if(yakuList.length>0){
      const pts=calcPoints(yakuList,wins[0],true);
      const pay=calcPayment(pts,true,pidx===G.dealerIdx);
      for(let p=0;p<4;p++){
        if(p===pidx) G.scores[p]+=pay.totalGain+G.riichiSticks*1000;
        else G.scores[p]-=(pidx===G.dealerIdx?pay.dealerPay:p===G.dealerIdx?pay.dealerPay:pay.nonDealerPay);
      }
      G.riichiSticks=0;
      showResultOverlay('ツモ！',G.names[pidx]+'のツモ和了',yakuList,pay.totalGain,wins[0]);
      return;
    }
  }
  
  // Riichi check
  if(!G.riichi[pidx]&&G.melds[pidx].length===0&&hand.length===14){
    for(let i=0;i<hand.length;i++){
      const test=hand.filter((_,j)=>j!==i);
      const waiting=findWaiting(test);
      if(waiting.length>0&&Math.random()<0.5){
        // CPU riichi
        G.riichi[pidx]=true;
        G.scores[pidx]-=1000;
        G.riichiSticks++;
        showLog(`${G.names[pidx]}: リーチ！`);
        cpuDiscard(pidx,hand[i]);
        return;
      }
    }
  }
  
  cpuDiscard(pidx,tileToDiscard);
}

function cpuChooseDiscard(hand){
  // Discard isolated tiles (no connections)
  // Simple heuristic: find least useful tile
  const sorted=sortHand(hand);
  
  // Count connections for each tile
  let minScore=99, minTile=sorted[0];
  for(const t of sorted){
    let score=0;
    for(const other of sorted){
      if(tileKey(t)===tileKey(other)) continue;
      if(t.suit===other.suit&&t.suit!=='honor'){
        const diff=Math.abs(t.n-other.n);
        if(diff===0) score+=3; // pair/koutsu
        else if(diff===1) score+=2; // sequential
        else if(diff===2) score+=1; // skip
      }
    }
    if(score<minScore){ minScore=score; minTile=t; }
  }
  return minTile;
}

function cpuDiscard(pidx,tile){
  const idx=G.hands[pidx].findIndex(x=>tileKey(x)===tileKey(tile));
  if(idx<0) return;
  G.hands[pidx].splice(idx,1);
  G.discards[pidx].push(tile);
  G.waitingTile=tile;
  G.waitingFrom=pidx;
  G.drewTile=false;
  G.phase='claim';

  showLog(`${G.names[pidx]}: ${tileText(tile)} を捨てた`);
  renderAll();

  // サーバーに捨て牌を通知（全員に同期）
  socket.emit("game-action", {
    roomId: G.roomId,
    data: { type: "discard", playerIdx: pidx, tile }
  });

  // プレイヤーがロンできるか確認
  const handPlus=[...G.hands[G.myIdx],tile];
  const wins=findWins(handPlus);
  if(wins.length>0){
    const ctx=buildCtx(G.myIdx,false);
    const yakuList=calcYaku(wins[0],ctx);
    if(yakuList.length>0){
      document.getElementById('btn-ron').disabled=false;
      setStatus(`ロン！ ${G.names[pidx]}が ${tileText(tile)} を捨てました`);
      setTurnTxt(true);
      G.ronTimeout=setTimeout(()=>{ if(G.phase==='claim'){ document.getElementById('btn-ron').disabled=true; checkClaims(pidx,tile); } },3000);
      return;
    }
  }

  setTimeout(()=>checkClaims(pidx,tile),300);
}

function cpuPon(pidx,tile,fromIdx){
  let removed=0;
  G.hands[pidx]=G.hands[pidx].filter(x=>{
    if(removed<2&&tileKey(x)===tileKey(tile)){removed++;return false;}
    return true;
  });
  G.melds[pidx].push({type:'pon',tiles:[tile,tile,tile]});
  G.waitingTile=null;
  G.turn=pidx;
  G.phase='discard';
  
  showLog(`${G.names[pidx]}: ポン！`);
  renderAll();
  scheduleCPU(pidx);
}

function cpuChi(pidx,tile){
  const chiSets=findChiSets(G.hands[pidx],tile);
  if(chiSets.length===0) return;
  const set=chiSets[Math.random()*chiSets.length|0];
  
  const toRemove=set.filter(x=>tileKey(x)!==tileKey(tile));
  for(const r of toRemove){
    const idx=G.hands[pidx].findIndex(x=>tileKey(x)===tileKey(r));
    if(idx>=0) G.hands[pidx].splice(idx,1);
  }
  G.melds[pidx].push({type:'chi',tiles:set});
  G.waitingTile=null;
  G.turn=pidx;
  G.phase='discard';
  
  showLog(`${G.names[pidx]}: チー！`);
  renderAll();
  scheduleCPU(pidx);
}

// ═══════════════════════════════════════════════════════
//  CTX BUILDER
// ═══════════════════════════════════════════════════════
function buildCtx(pidx,tsumo){
  const relWind=(pidx-G.dealerIdx+4)%4;
  const roundWind=G.roundNum<4?0:1;
  return {
    riichi:G.riichi[pidx],
    tsumo,
    meldCount:G.melds[pidx].length,
    seatWind:relWind,
    roundWind,
    lastTile:G.waitingTile,
    isLastDraw:G.deck.length===0
  };
}

// ═══════════════════════════════════════════════════════
//  END CONDITIONS
// ═══════════════════════════════════════════════════════
function enableMyActions(){
  const hand=G.hands[G.myIdx];
  
  // Tsumo check
  const wins=findWins(hand);
  document.getElementById('btn-tsumo').disabled=wins.length===0||calcYaku(wins[0],buildCtx(G.myIdx,true)).length===0;
  
  // Riichi check
  if(!G.riichi[G.myIdx]&&G.melds[G.myIdx].length===0){
    document.getElementById('btn-riichi').disabled=true; // enabled when tile selected
  }
  
  // Kan check (ankan: 4 of same)
  const counts={};
  for(const t of hand){ const k=tileKey(t); counts[k]=(counts[k]||0)+1; }
  document.getElementById('btn-kan').disabled=!Object.values(counts).some(c=>c>=4);
  
  document.getElementById('btn-discard').disabled=true; // enable on select
  document.getElementById('btn-draw').disabled=true;
  document.getElementById('btn-pon').disabled=true;
  document.getElementById('btn-chi').disabled=true;
  document.getElementById('btn-ron').disabled=true;
  
  setTurnTxt(true);
  setStatus('牌を選んで切るか、和了を宣言してください');
}

function disableAllActions(){
  ['btn-draw','btn-discard','btn-tsumo','btn-ron','btn-riichi','btn-pon','btn-chi','btn-kan'].forEach(id=>{
    document.getElementById(id).disabled=true;
  });
}

function ryukyoku(){
  G.phase='end';
  clearTimeout(G.cpuTimer);
  
  // Check tenpai
  const tenpaiPlayers=[];
  const noTenpai=[];
  for(let p=0;p<4;p++){
    const h=G.hands[p].length===14?G.hands[p].slice(0,-1):G.hands[p];
    if(findWaiting(h).length>0) tenpaiPlayers.push(p);
    else noTenpai.push(p);
  }
  
  let msg=`荒牌流局（牌山終了）\n\n`;
  
  // Payments
  if(tenpaiPlayers.length>0&&tenpaiPlayers.length<4){
    const pay=3000/tenpaiPlayers.length|0;
    const recv=3000/tenpaiPlayers.length|0;
    for(const p of tenpaiPlayers){ G.scores[p]+=recv; msg+=`${G.names[p]}: テンパイ +${recv}点\n`; }
    for(const p of noTenpai){ G.scores[p]-=pay; msg+=`${G.names[p]}: ノーテン -${pay}点\n`; }
  } else {
    msg+='全員テンパイ or 全員ノーテン — 点数移動なし';
  }
  
  G.honba++;
  document.getElementById('ryu-msg').innerHTML=msg.replace(/\n/g,'<br>');
  showOverlay('ov-ryukyoku');
  renderScores();
}

function nextRound(){
  hideOverlay('ov-result');
  hideOverlay('ov-ryukyoku');
  // ディーラーが上がった場合は連荘（dealerIdxそのまま）、それ以外は親を移す
  // ここでは単純に次の局へ（dealer rotation はrequestNextRoundで処理）
  G.roundNum=Math.min(G.roundNum+1,7);
  G.dealerIdx=(G.dealerIdx+1)%4;
  G.honba=0;
  // ホストのみサーバーへ通知。非ホストはgame-startイベントを待つ
  if(isHost()){
    requestNextRound();
  }
}

// ═══════════════════════════════════════════════════════
//  RESULT OVERLAY
// ═══════════════════════════════════════════════════════
function showResultOverlay(title,winner,yakuList,pts,decomp){
  G.phase='end';
  clearTimeout(G.cpuTimer);
  disableAllActions();
  
  // ホストが結果をサーバー経由で全員に同期
  if(isHost()&&decomp!==null){
    socket.emit("broadcast-result", {
      roomId: G.roomId,
      data: { title, winner, yakuList, pts, scores: G.scores, riichiSticks: G.riichiSticks }
    });
  }
  
  document.getElementById('res-title').textContent=title;
  document.getElementById('res-winner').textContent=winner;
  
  const yt=document.getElementById('res-yaku');
  yt.innerHTML='';
  let han=0;
  for(const y of yakuList){
    han+=y.han;
    const r=document.createElement('div');
    r.className='yaku-row';
    r.innerHTML=`<span>${y.name}</span><span class="han">${y.han}飜</span>`;
    yt.appendChild(r);
  }
  // Show dora
  const doraCount=countDora(G.hands[G.myIdx]||[],G.dora);
  if(doraCount>0){
    const r=document.createElement('div');
    r.className='yaku-row';
    r.innerHTML=`<span>ドラ</span><span class="han">${doraCount}飜</span>`;
    yt.appendChild(r);
    han+=doraCount;
  }
  const total=document.createElement('div');
  total.className='yaku-row';
  total.style.cssText='border-top:1px solid rgba(201,168,76,.3);margin-top:.3rem;padding-top:.3rem;font-weight:700;color:var(--gold)';
  total.innerHTML=`<span>合計</span><span class="han">${han}飜</span>`;
  yt.appendChild(total);
  
  document.getElementById('res-pts').textContent=pts.toLocaleString()+'点';
  showOverlay('ov-result');
  renderScores();
}

function countDora(hand,doraIndicators){
  let count=0;
  for(const ind of doraIndicators){
    const d=doraFromIndicator(ind);
    count+=hand.filter(t=>tileKey(t)===tileKey(d)).length;
  }
  return count;
}

// ═══════════════════════════════════════════════════════
//  UI HELPERS
// ═══════════════════════════════════════════════════════
function showOverlay(id){ document.getElementById(id).classList.add('show'); }
function hideOverlay(id){ document.getElementById(id).classList.remove('show'); }
function setStatus(txt){ document.getElementById('status-txt').textContent=txt; }
function setTurnTxt(myTurn){
  const el=document.getElementById('turn-txt');
  el.textContent=myTurn?'あなたのターン':'CPUのターン';
  el.className='turn-txt '+(myTurn?'my':'cpu');
}
function showLog(txt,cls=''){
  const box=document.getElementById('game-log');
  const d=document.createElement('div');
  d.className='log-entry'+(cls?' '+cls:'');
  d.textContent=txt;
  box.appendChild(d);
  box.scrollTop=box.scrollHeight;
  while(box.children.length>30) box.removeChild(box.firstChild);
}

// ═══════════════════════════════════════════════════════
//  KEYBOARD
// ═══════════════════════════════════════════════════════
document.addEventListener('keydown',e=>{
  if(G.phase==='draw'&&G.turn===G.myIdx&&e.key==='Enter') actionDraw();
  if(G.phase==='discard'&&G.turn===G.myIdx&&e.key==='Enter'&&G.selectedIdx>=0) actionDiscard();
  if(e.key==='t'||e.key==='T') actionTsumo();
  if(e.key==='r'||e.key==='R') { if(!document.getElementById('btn-ron').disabled) actionRon(); }
});
